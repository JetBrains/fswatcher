name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      rust_log:
        description: "RUST_LOG for the test step, e.g. jetbrains_fswatcher=debug (the fs tests log nothing by default)"
        required: false
        default: ""

permissions:
  contents: read

# A new push to a branch supersedes the run that is already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Only used to resolve dependencies to their minimum versions. Bump deliberately,
  # ideally in the same commit that bumps rust-toolchain.toml.
  rust_nightly: nightly-2026-11-23

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing should not hide the results of the others: the
      # backends are entirely separate implementations.
      fail-fast: false
      matrix:
        include:
          - name: Linux (inotify)
            os: ubuntu-latest
          - name: macOS (FSEvents/kqueue)
            os: macos-latest
          - name: Windows (ReadDirectoryChangesW)
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The runners ship rustup, and its cargo/rustc proxies install the version
      # pinned in `rust-toolchain` on first use. Doing it here keeps the download
      # out of the build log and fails early if the pinned version is gone.
      - name: Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # Covers the lib, the integration tests, the benches and the examples.
      - name: Build
        run: cargo build --locked --all-targets

      # The end-to-end tests in `tests/legacy_tests.rs` drive real file system
      # events, so they are the ones most likely to be slow on a CI machine.
      # They print nothing unless RUST_LOG is set; re-run the workflow manually
      # with the `rust_log` input to get tracing output out of a failure.
      - name: Test
        run: cargo test --locked --no-fail-fast
        env:
          RUST_LOG: ${{ github.event.inputs.rust_log }}

  # Proves that the version floors in Cargo.toml are honest: every direct dependency
  # is resolved to the oldest version the manifest allows, and the crate must still
  # build on all three platforms and pass its tests.
  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml selects the stable toolchain that builds and tests.
      # The pinned nightly is used for exactly one thing: the unstable resolver flag.
      - name: Rust toolchains
        run: |
          rustup toolchain install ${{ env.rust_nightly }} --profile minimal
          rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
          rustc --version

      - name: Resolve direct dependencies to their minimum versions
        run: cargo +${{ env.rust_nightly }} update -Z direct-minimal-versions

      # `--locked` keeps the lock file the step above produced from being re-resolved.
      - name: Check all platforms
        run: |
          cargo check --locked --all-targets
          cargo check --locked --all-targets --target x86_64-pc-windows-msvc
          cargo check --locked --all-targets --target aarch64-apple-darwin

      - name: Test
        run: cargo test --locked --no-fail-fast
