[package]
name = "jetbrains-fswatcher"
# Placeholder: the release workflow sets the version from the pushed tag.
version = "0.0.0"
edition = "2021"
resolver = "2"
description = "A cross-platform file system watcher (FSEvents/kqueue, inotify, ReadDirectoryChangesW) with symlink canonicalization"
license = "Apache-2.0"
repository = "https://github.com/JetBrains/fswatcher"
readme = "README.md"
keywords = ["filesystem", "watcher", "fsevents", "inotify", "symlink"]
categories = ["filesystem", "asynchronous"]

[lib]
doctest = false

[profile.dev]
opt-level = 0
debug-assertions = true

[profile.release]
lto = true
strip = "symbols"

[lints.clippy]
needless_return = "allow"
new_without_default = "allow"
too_many_arguments = "allow"
match_like_matches_macro = "allow"
type_complexity = "allow"

[dependencies]
anyhow = "1.0.52"
async-stream = "0.3.2"
futures = "0.3"
slab = "0.4.4"
thiserror = "2.0"
tokio = { version = "1.48", features = ["sync", "macros"] }
tracing = "0.1.30"

[target.'cfg(target_os="linux")'.dependencies]
inotify = "0.11"
tokio = { version = "1.48", features = ["rt"] }

[target.'cfg(target_os="windows")'.dependencies]
tokio = { version = "1.48", features = ["time", "fs"] }
windows = { version = "0.62", features = ["Devices_Enumeration", "Devices_Portable", "Foundation", "Storage", "Storage_Search", "Win32_Foundation", "Win32_Security", "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(target_os="macos")'.dependencies]
bitflags = "2.5"
core-foundation = { version = "0.10", features = ["mac_os_10_8_features"] }
dispatch2 = "0.3"
nix = {  version = "0.31", features = ["event", "fs"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "time", "macros"] }
tempfile = "3.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
