[package]
name = "jetbrains-fswatcher"
# Placeholder: the release workflow sets the version from the pushed tag.
version = "0.0.0"
edition = "2021"
resolver = "2"
description = "A cross-platform file system watcher (FSEvents/kqueue, inotify, ReadDirectoryChangesW) with symlink canonicalization"
license = "Apache-2.0"
repository = "https://github.com/JetBrains/fswatcher"
readme = "README.md"
keywords = ["filesystem", "watcher", "fsevents", "inotify", "notify", "symlink"]
categories = ["filesystem", "asynchronous"]

[lib]
doctest = false

[profile.dev]
opt-level = 0
debug-assertions = true

[profile.release]
lto = true
strip = "symbols"

[lints.clippy]
needless_return = "allow"
new_without_default = "allow"
too_many_arguments = "allow"
match_like_matches_macro = "allow"
type_complexity = "allow"

[dependencies]
anyhow = "1.0"
async-stream = "0.3.6"
bitvec = "1"
futures = "0.3"
slab = "0.4"
thiserror = "2.0"
tokio  = { version = "1.53", features = ["full"] }
tracing = "0.1.44"

[target.'cfg(target_os="linux")'.dependencies]
inotify = "0.11"

[target.'cfg(target_os="windows")'.dependencies]
windows = { version = "0.58.0", features = ["Devices_Enumeration", "Devices_Portable", "Foundation", "Storage", "Win32_Foundation", "Win32_Security", "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(target_os="macos")'.dependencies]
bitflags= "2.13.2"
core-foundation = { version = "0.10", features = ["mac_os_10_8_features"] }
dispatch2 = "0.3"
nix = {  version = "0.29", features = ["event", "fs"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
